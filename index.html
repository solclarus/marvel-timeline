<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marvel Timeline</title>
    <meta
      name="description"
      content="An interactive map of how Marvel films and series connect: the MCU, the Netflix Defenders Saga, Fox X-Men, Sony's Spider-Man films, and more. Pick a work to see what to watch first."
    />
    <meta name="theme-color" content="#141414" />
    <link rel="canonical" href="https://solclarus.github.io/marvel-timeline/" />
    <!-- Posters come from TMDB's image CDN; connect while the app loads. -->
    <link rel="preconnect" href="https://image.tmdb.org" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marvel Timeline" />
    <meta property="og:title" content="Marvel Timeline" />
    <meta
      property="og:description"
      content="An interactive map of how Marvel films and series connect: the MCU, the Netflix Defenders Saga, Fox X-Men, Sony's Spider-Man films, and more. Pick a work to see what to watch first."
    />
    <meta property="og:url" content="https://solclarus.github.io/marvel-timeline/" />
    <!-- Absolute: crawlers don't resolve relative image URLs. -->
    <meta property="og:image" content="https://solclarus.github.io/marvel-timeline/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Marvel Timeline: a graph of connected films and series"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="min-h-screen bg-background font-sans antialiased">
    <!-- Painted before the app's scripts arrive; React replaces it. Inline
         styles: the stylesheet may not have loaded yet either. -->
    <div id="root">
      <div
        style="
          display: flex;
          height: 100vh;
          align-items: center;
          justify-content: center;
          background: #262626;
          color: rgba(255, 255, 255, 0.55);
          font:
            600 14px/1.4 system-ui,
            sans-serif;
          letter-spacing: 0.04em;
        "
      >
        Marvel Timeline
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
