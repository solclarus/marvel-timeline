<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marvel Timeline</title>
    <meta
      name="description"
      content="An interactive map of how Marvel films and series connect: the MCU, the Netflix Defenders Saga, Fox X-Men, Sony's Spider-Man films, and more. Pick a work to see what to watch first."
    />
    <meta name="theme-color" content="#f5f3ef" />
    <!-- The theme before first paint: the viewer's pick, else the system's.
         Mirrors src/lib/theme.ts. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("marvel-timeline:theme");
        } catch (e) {}
        var dark =
          theme === "dark" ||
          (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        if (dark) document.querySelector('meta[name="theme-color"]').content = "#141414";
      })();
    </script>
    <style>
      /* The placeholder below, in each theme's canvas color. */
      #boot {
        display: flex;
        height: 100vh;
        align-items: center;
        justify-content: center;
        background: #e0ddd9;
        color: rgba(0, 0, 0, 0.6);
        font:
          600 14px/1.4 system-ui,
          sans-serif;
        letter-spacing: 0.04em;
      }
      .dark #boot {
        background: #262626;
        color: rgba(255, 255, 255, 0.55);
      }
    </style>
    <link rel="canonical" href="https://solclarus.github.io/marvel-timeline/" />
    <!-- Posters come from TMDB's image CDN; connect while the app loads. -->
    <link rel="preconnect" href="https://image.tmdb.org" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marvel Timeline" />
    <meta property="og:title" content="Marvel Timeline" />
    <meta
      property="og:description"
      content="An interactive map of how Marvel films and series connect: the MCU, the Netflix Defenders Saga, Fox X-Men, Sony's Spider-Man films, and more. Pick a work to see what to watch first."
    />
    <meta property="og:url" content="https://solclarus.github.io/marvel-timeline/" />
    <!-- Absolute: crawlers don't resolve relative image URLs. -->
    <meta property="og:image" content="https://solclarus.github.io/marvel-timeline/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Marvel Timeline: a graph of connected films and series"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Installable to a home screen; no service worker, so the data a visit
         shows is always the latest deployed. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="icon"
      href="/favicon.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-dark.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
  </head>
  <body class="min-h-screen bg-background font-sans antialiased">
    <!-- Painted before the app's scripts arrive; React replaces it. Styled
         inline in <head>: the stylesheet may not have loaded yet either. -->
    <div id="root">
      <div id="boot">Marvel Timeline</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
